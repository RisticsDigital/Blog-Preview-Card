<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

    <title>Frontend Mentor | Blog preview card</title>

    <link rel="stylesheet" href="css/styles.css">
  </head>
  <body>
    <main class="card">
      <section class=content>
        <picture class="hero-img">
          <img class="hero" src="assets/images/illustration-article.svg" alt="Cover art showcasing abstract HTML symbols">
        </picture>
        <h3>Learning</h3>
        <p class="date">Published 21 Dec 2023</p>
        <h1>HTML & CSS foundations</h1>
        <p class="desc">These languages are the backbone of every website, defining structure, content, and presentation</p>
        <div class="author">
          <img class="avatar" src="assets/images/image-avatar.webp" alt="Photo of Greg Hooper's face">
          <p class="name">Greg Hooper</p>
        </div>
      </section>
    </main>
  </body>
</html>
